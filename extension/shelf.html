<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDOWN Shelf</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f4edf9;background:#12101a}
*{box-sizing:border-box}body{margin:0;padding:18px;min-width:260px}
header{display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}h2{font-size:13px;margin:0 0 8px}.muted{color:#b9abc7;font-size:12px}section{border:1px solid #463952;border-radius:12px;padding:13px;margin:15px 0;background:#211a2c}
.provider{display:flex;align-items:center;gap:12px;margin:10px 0}.provider strong{display:block}.provider .label{flex:1}button,select{font:inherit;background:#6544a4;border:1px solid #9472c6;color:white;padding:8px;border-radius:8px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#30273f}select{width:100%}button:focus-visible,select:focus-visible{outline:2px solid white;outline-offset:2px}#status{min-height:1em}
</style></head><body>
<header><h1>REDOWN Shelf</h1><button id="dashboard" class="secondary">Dashboard</button></header>
<p class="muted">Save to your cloud. Cloudflare TRUE REMOTE and browser-relayed providers.</p>
<section aria-label="Cloud providers"><h2>Your clouds</h2>
<div class="provider"><div class="label"><strong>Google Drive</strong><span class="muted">RIGHT CLICK 2 CLOUD · OAuth integration pending</span></div><button id="google" disabled title="Google Drive sign-in is not configured yet">Connect</button></div>
<div class="provider"><div class="label"><strong>OneDrive</strong><span class="muted">RIGHT CLICK 2 CLOUD · Integration pending</span></div><button id="onedrive" disabled title="OneDrive sign-in is not configured yet">Connect</button></div>
<div class="provider"><div class="label"><strong>Cloudflare R2</strong><span class="muted" id="cf-state">Checking connection…</span></div><button id="cloudflare">Connect</button></div>
</section>
<section><h2>Toolbar opening preference</h2><label class="muted" for="toolbar-mode">When I click REDOWN</label><select id="toolbar-mode"><option value="shelf">Open Shelf (default)</option><option value="popup">Open compact Popup</option></select></section>
<p id="status" class="muted" role="status" aria-live="polite"></p>
<script src="shelf.js"></script></body></html>
