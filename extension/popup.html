<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>REDOWN</title><link rel="icon" href="icons/icon32.png">
  <style>
    @font-face{font-family:DM Sans;src:url("fonts/dm-sans-latin-variable.woff") format("woff");font-weight:100 1000;font-display:swap}
    :root{color-scheme:dark;--text:#f5effb;--muted:#b6a9c5;--good:#7ce3b2;--bad:#ff9aa9}*{box-sizing:border-box}
    body{margin:0;width:320px;background:radial-gradient(ellipse at 100% 0%,#30204488,transparent 65%),#0d0b15;color:var(--text);font:13px/1.45 "DM Sans",system-ui,sans-serif}
    .shell{padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:34px;height:34px;border-radius:11px}.wordmark{font-weight:850;letter-spacing:.14em;font-size:14px}.tag{font-size:10px;color:var(--muted)}
    button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d0aafa;outline-offset:4px}
    .connection{display:flex;align-items:center;gap:6px;border:1px solid #59405466;border-radius:20px;background:#ffffff03;padding:7px 9px;color:var(--bad);font-size:9px;font-weight:700;letter-spacing:.06em}.connection .light{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px #ff8b9b33}.connection[data-state="connected"]{color:var(--good)}.connection[data-state="connected"] .light{background:var(--good);box-shadow:0 0 8px #7ce3b233}.connection[data-state="checking"]{color:#d4bee9}.connection[data-state="checking"] .light{background:#d4bee9;animation:breathe 1.2s ease-in-out infinite}.connection:disabled{cursor:default}@keyframes breathe{50%{opacity:.35;transform:scale(.75)}}
    .dashboard{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 15px;border:1px solid #d6b7ff33;border-radius:12px;background:linear-gradient(110deg,#8053cd,#a674e5);box-shadow:0 5px 20px #7942ba22;color:#fff;font-weight:750;text-align:left;transition:filter .15s}.dashboard:hover{filter:brightness(1.08)}.dashboard span{font-size:18px;font-weight:400}
    .hint{font-size:11px;color:var(--muted);margin:10px 1px 0}.counter-panel{margin-top:24px;padding-top:18px;border-top:1px solid #bca1d41c;text-align:center}.counter-label{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
    .odometer{width:100%;cursor:default;display:flex;justify-content:center;gap:4px;padding:9px;border:1px solid #493652;border-radius:11px;background:#09070e;box-shadow:inset 0 2px 7px #0008,0 1px #ffffff05;overflow:hidden}.odometer[data-login]{cursor:pointer}.odometer[data-login]:hover{border-color:#bc8dc5}.wheel{position:relative;flex:1;max-width:38px;height:1.35em;overflow:hidden;border-radius:4px;background:linear-gradient(#292032,#17111f 49%,#302337 50%,#201727);box-shadow:inset 0 1px #ffffff0a;font:600 clamp(12px,calc(190px / var(--digits,6)),29px)/1.35 "DM Sans",system-ui,sans-serif;color:#f6e8ff;font-variant-numeric:tabular-nums}.wheel::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #0007;pointer-events:none}.reel{display:block;transform:translateY(calc(var(--digit,0) * -1.35em));transition:transform .65s cubic-bezier(.2,.75,.2,1)}.reel span{display:block;height:1.35em}.counter-note{font-size:10px;color:#ba9ed0;margin:9px 0 0}.status{font-size:11px;color:var(--muted);margin:12px 0 0;overflow-wrap:anywhere}.status:empty{display:none}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.reel,.dashboard{transition:none}.connection[data-state="checking"] .light{animation:none}}
  </style>
</head>
<body><main class="shell">
  <header><div class="brand"><img src="icon.svg" alt=""><div><div class="wordmark">REDOWN</div><div class="tag">Your cloud companion ✦</div></div></div><button id="connection" class="connection" type="button" data-state="checking" aria-label="Checking Cloudflare connection" title="Checking Cloudflare connection"><span class="light" aria-hidden="true"></span></button></header>
  <button id="dashboard" class="dashboard" type="button">Go to Dashboard <span aria-hidden="true">↗</span></button>
  <p class="hint">Your files. Your destinations. All in one place.</p>
  <section class="counter-panel" aria-label="Delivery counter"><div class="counter-label">Files delivered</div><button id="odometer" class="odometer" type="button" aria-label="Checking Cloudflare connection" disabled></button><p id="counter-note" class="counter-note">Warming up…</p></section>
  <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
</main><script src="popup.js"></script></body>
</html>
