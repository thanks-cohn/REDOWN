[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redown-client"
version = "0.3.0"
description = "Provider-neutral client for an owner-authorized REDOWN session"
requires-python = ">=3.10"
license = {text = "Proprietary; see repository LICENSE"}
dependencies = []

[project.scripts]
redown = "redown.cli:main"

[tool.setuptools.packages.find]
include = ["redown*"]
