name: OneDrive focused regression

on:
  push:
    branches:
      - codex/v3-parity-first-reconstruction
    paths:
      - 'extension/onedrive-*.js'
      - 'extension/background.js'
      - 'extension/shelf-onedrive.js'
      - 'extension/shelf.html'
      - 'tests/onedrive*.test.mjs'
      - 'scripts/syntax-targets.json'
      - '.github/workflows/onedrive-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-syntax.mjs
      - run: node --test tests/onedrive.test.mjs tests/onedrive-oauth-diagnostic.test.mjs tests/onedrive-connected.test.mjs
