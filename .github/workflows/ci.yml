name: Reliability regression gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-regression:
    name: Local regression ratchet (not release certification)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run reliability:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-reliability-node-${{ matrix.node }}
          path: work/reliability/latest.json
          if-no-files-found: error
  diagnostic-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python tests/agent-gateway-schema.py
      - run: python tests/explorer-diagnostic-schema.py
      - run: python tests/runtime-schema-conformance.py
  windows-contracts:
    name: Windows syntax and issue-inventory contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-syntax.mjs
      - run: node --test tests/syntax-portability.test.mjs tests/issue-inventory.test.mjs
      - run: node agent/diagnostics/cli.mjs validateIssues
